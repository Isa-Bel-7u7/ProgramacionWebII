<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lista de Salas</title>
  <link rel="stylesheet" href="../assets/styles_listas_sala.css" />
</head>
<body>
  <header class="header">
    <h1>Lista de Salas</h1>
    <nav>
      <ul class="header__nav">
        <li><a href="index.html">Películas</a></li>
        <li><a href="salas.html">Registrar Sala</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="busqueda-section">
      <input type="text" placeholder="Buscar por número o descripción..." data-buscador-salas>
      <button data-btn-buscar-salas>Buscar</button>
    </section>
    <section class="tabla-section">
      <table class="tabla-peliculas">
        <thead>
          <tr>
            <th>Número</th>
            <th>Nro Sillas</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody data-table>
          <!-- Aquí se insertarán dinámicamente las filas con JavaScript -->
        </tbody>
      </table>
    </section>
  </main>
  <script type="module" src="../controllers/salas_controller.js"></script>
</body>
</html>
