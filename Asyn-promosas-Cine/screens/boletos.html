<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Boleto</title>
  <link rel="stylesheet" href="../assets/styles_boletos.css" />
</head>
<body>
  <header class="header">
    <h1 class="header__title">Boletos</h1>
    <nav>
      <ul class="header__nav">
        <li><a href="index.html">Películas</a></li>
        <li><a href="lista_clientes.html">Clientes</a></li>
        <li><a href="lista_salas.html">Salas</a></li>
        <li><a href="boletos.html" class="active">Registrar Boleto</a></li>
        <li><a href="lista_boletos.html">Lista de Boletos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Registrar / Editar Boleto</h2>
      <form class="boleto-form" data-form>
        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required data-fecha />
        </div>
        <div class="form-group">
          <label for="hora">Hora</label>
          <input type="time" id="hora" name="hora" required data-hora />
        </div>
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <input type="text" id="descripcion" name="descripcion" required data-descripcion placeholder="Ej: Cancelado, Reservado, Pagado..." />
        </div>
        <div class="form-group">
          <label for="id_pelicula">Película</label>
          <select id="id_pelicula" name="id_pelicula" required data-id-pelicula>
            <option value="">Seleccione una película</option>
            <!-- Opciones dinámicas con JS -->
          </select>
        </div>
        <div class="form-group">
          <label for="id_cliente">Cliente</label>
          <select id="id_cliente" name="id_cliente" required data-id-cliente>
            <option value="">Seleccione un cliente</option>
            <!-- Opciones dinámicas con JS -->
          </select>
        </div>
        <div class="form-group">
          <label for="id_sala">Sala</label>
          <select id="id_sala" name="id_sala" required data-id-sala>
            <option value="">Seleccione una sala</option>
            <!-- Opciones dinámicas con JS -->
          </select>
        </div>
        <button type="submit" class="btn-registrar">Guardar Boleto</button>
      </form>
    </section>
  </main>
  <script type="module" src="../controllers/boletos_form_controller.js"></script>
</body>
</html>
