<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Sala</title>
  <link rel="stylesheet" href="../assets/stylesalas.css" />
</head>
<body>
  <header class="header">
    <h1>Salas</h1>
    <nav>
      <ul class="header__nav">
        <li><a href="index.html">Películas</a></li>
        <li><a href="lista_salas.html">Lista de Salas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Registrar / Editar Sala</h2>
      <form class="sala-form" data-form>
        <div class="form-group">
          <label for="nro_sala">Número de Sala</label>
          <input type="number" id="id_nro_sala" name="id_nro_sala" required data-id-nro-sala />
        </div>
        <div class="form-group">
          <label for="nro_sillas">Número de Sillas</label>
          <input type="number" id="nro_sillas" name="nro_sillas" required data-nro-sillas />
        </div>
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <input type="text" id="descripcion" name="descripcion" data-descripcion />
        </div>
        <button type="submit" class="btn-registrar">Guardar Sala</button>
      </form>
    </section>
  </main>
  <script type="module" src="../controllers/salas_form_controller.js"></script>
</body>
</html>
