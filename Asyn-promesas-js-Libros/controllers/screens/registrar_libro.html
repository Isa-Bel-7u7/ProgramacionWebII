<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Libro</title>
    <link rel="stylesheet" href="../screens/service/assets/css/estilos_libro.css">
</head>
<body>
    <header class="header">
        <img src="../assets/img/doguitoadm.svg" alt="Logo Biblioteca" class="header__logo" />
        <h1 class="header__title">Biblioteca Clásica</h1>
        <nav>
            <ul class="header__nav">
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Libros</a></li>
                <li><a href="#">Autores</a></li>
                <li><a href="#">Favoritos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-section">
            <h2>Registrar un nuevo libro</h2>
            <form class="libro-form">
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" placeholder="Título del libro" required>
                </div>
                <div class="form-group">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" placeholder="Autor" required>
                </div>
                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" placeholder="ISBN" required>
                </div>
                <div class="form-group">
                    <label for="anio">Año</label>
                    <input type="number" id="anio" placeholder="Año de publicación" min="0" max="2100">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" placeholder="Breve descripción"></textarea>
                </div>
                <button type="submit" class="btn-registrar">Registrar Libro</button>
            </form>
        </section>
    </main>
</body>
</html>
